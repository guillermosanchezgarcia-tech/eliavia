# Configuración para publicar la app en Netlify.
# En Netlify hay que indicar «Base directory: campo-op»; el resto lo lee de aquí.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Todas las direcciones (/socios, /fincas/123…) las resuelve la propia app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El «service worker» (lo que permite usar la app sin conexión) no se debe
# guardar en caché, para que las actualizaciones lleguen siempre.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
